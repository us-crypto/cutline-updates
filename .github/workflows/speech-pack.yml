name: speech-pack

# Stores downloadable speech packs in this repository, split into parts small enough to be
# served directly. The app downloads the parts, joins them and checks the result.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Pack name, e.g. fa or en-pro or vad"
        required: true
      url:
        description: "Source file"
        required: true

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and split
        env:
          NAME: ${{ inputs.name }}
          URL: ${{ inputs.url }}
        run: |
          mkdir -p speech
          curl -sSL --retry 4 -o "$RUNNER_TEMP/pack.bin" "$URL"
          ls -la "$RUNNER_TEMP/pack.bin"
          rm -f "speech/$NAME".part*
          split -b 95000000 -d -a 1 "$RUNNER_TEMP/pack.bin" "speech/$NAME.part"
          SHA=$(sha256sum "$RUNNER_TEMP/pack.bin" | cut -d' ' -f1)
          BYTES=$(stat -c %s "$RUNNER_TEMP/pack.bin")
          printf '{"sha256": "%s", "bytes": %s, "parts": %s}\n' "$SHA" "$BYTES" "$(ls speech/$NAME.part* | wc -l)" > "speech/$NAME.json"
          cat "speech/$NAME.json"
      - name: Save
        run: |
          git config user.name us-crypto
          git config user.email 85217606+us-crypto@users.noreply.github.com
          git add speech
          git commit -m "Speech pack ${{ inputs.name }}" || exit 0
          git pull --rebase
          git push
