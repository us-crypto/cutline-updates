name: cc0

# Fetches free (CC0 / public-domain) sounds and music into this repository.
on:
  workflow_dispatch:
    inputs:
      which:
        description: "kenney, freepd or both"
        default: "kenney freepd"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 tools/cc0_fetch.py ${{ inputs.which }}
      - name: Save
        run: |
          git config user.name us-crypto
          git config user.email 85217606+us-crypto@users.noreply.github.com
          git add cc0 music
          git commit -m "Free sounds and music" || exit 0
          git pull --rebase
          git push
